name: catalog-sync

on:
  schedule:
    # Nightly 06:17 UTC
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: catalog-sync
  cancel-in-progress: false

jobs:
  sync:
    name: sync url-sanitize catalog
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read pinned crate version
        id: pin
        run: |
          pinned="$(sed -nE 's/^url-sanitize-core = "([^"]+)"/\1/p' Cargo.toml | head -n1)"
          if [ -z "$pinned" ]; then
            echo "Could not read url-sanitize-core from Cargo.toml" >&2
            exit 1
          fi
          echo "version=$pinned" >> "$GITHUB_OUTPUT"

      - name: Read newest published crates.io version
        id: crates
        run: |
          newest="$(curl -fsSL \
            -H 'User-Agent: wundspray-catalog-sync (github.com/nonninz/wundspray)' \
            https://crates.io/api/v1/crates/url-sanitize-core \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["crate"]["newest_version"])')"
          echo "version=$newest" >> "$GITHUB_OUTPUT"
          echo "Pinned=${{ steps.pin.outputs.version }} newest=$newest"

      - name: Decide whether sync is needed
        id: need
        run: |
          if [ "${{ steps.pin.outputs.version }}" = "${{ steps.crates.outputs.version }}" ]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Rust toolchain
        if: steps.need.outputs.needed == 'true'
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy

      - name: Cache cargo
        if: steps.need.outputs.needed == 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Run catalog sync
        if: steps.need.outputs.needed == 'true'
        run: make sync-catalog

      - name: Verify
        if: steps.need.outputs.needed == 'true'
        run: make check

      - name: Open pull request
        if: steps.need.outputs.needed == 'true'
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          branch: chore/catalog-sync-v${{ steps.crates.outputs.version }}
          delete-branch: true
          title: "Refresh URL cleaning rules to url-sanitize ${{ steps.crates.outputs.version }}"
          commit-message: "chore(catalog): sync url-sanitize-core ${{ steps.crates.outputs.version }}"
          body: |
            ## What this does

            Upstream published **url-sanitize-core ${{ steps.crates.outputs.version }}** on crates.io.
            This PR pulls that release into wundspray so the embedded cleaning rules stay in sync
            with the library we depend on.

            ## What changed

            - Bumped `url-sanitize-core` to ${{ steps.crates.outputs.version }}
            - Replaced `catalog/catalog.json` with the catalog from that release
            - Rewrote `catalog/PIN.txt` to match

            ## What did not change

            - `catalog/overlay.json` (local Instagram hotfixes) is left alone
            - No API or runtime config changes
            - No breaking service behavior expected beyond newer upstream strip/unwrap rules

            ## Operator notes

            Nothing to reconfigure. Merge when CI is green; the next image/release build will
            embed the updated rules automatically.
