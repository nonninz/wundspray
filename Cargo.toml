[package]
name = "wundspray"
version = "0.3.0"
edition = "2021"
rust-version = "1.75"
description = "Tiny HTTP service that unwraps tracking redirects and strips tracking parameters from URLs"
# Service code is MIT; the distributed binary embeds LGPL/MPL catalog data.
license = "MIT AND LGPL-3.0-only AND MPL-2.0"
readme = "README.md"
repository = "https://github.com/nonninz/wundspray"

[dependencies]
axum = { version = "0.8", features = ["json"] }
ipnet = "2.12.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "ansi", "fmt"] }
url-sanitize-core = "2.4.1"
uuid = { version = "1.20.0", features = ["v4"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
