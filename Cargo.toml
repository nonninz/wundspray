[package]
name = "wundspray"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Tiny HTTP service that unwraps tracking redirects and strips tracking parameters from URLs"
license = "MIT"
readme = "README.md"
repository = "https://github.com/antonio-orionus/wundspray"

[dependencies]
axum = { version = "0.8", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "ansi", "fmt"] }
url-sanitize-core = "2.4.1"

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
