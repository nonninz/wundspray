<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>wundspray</title>
    <link rel="stylesheet" href="/assets/app.css" />
  </head>
  <body>
    <main class="page">
      <h1 class="brand">wundspray</h1>
      <p class="tagline">Strip tracking params and unwrap redirectors from a URL.</p>

      <form id="clean-form" class="form" autocomplete="off">
        <label class="label" for="url-input">URL</label>
        <input
          id="url-input"
          class="input"
          name="url"
          type="url"
          inputmode="url"
          required
          placeholder="https://example.com/?utm_source=newsletter"
        />
        <button id="submit-btn" class="button" type="submit">Clean</button>
      </form>

      <section id="error" class="panel error" hidden></section>

      <section id="result" class="panel result" hidden>
        <div class="result-row">
          <span class="result-label">Cleaned URL</span>
          <button id="copy-btn" class="button secondary" type="button">Copy</button>
        </div>
        <p id="result-url" class="result-url"></p>
        <dl class="meta">
          <div>
            <dt>Action</dt>
            <dd id="result-action"></dd>
          </div>
          <div>
            <dt>Changed</dt>
            <dd id="result-changed"></dd>
          </div>
          <div id="stripped-wrap" hidden>
            <dt>Stripped params</dt>
            <dd id="result-stripped"></dd>
          </div>
        </dl>
      </section>
    </main>
    <script src="/assets/app.js" defer></script>
  </body>
</html>
